[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fsi-ice"
version = "0.1.0"
description = "Self-developed finite-element infrastructure for FSI research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "scipy>=1.12", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fsi-ice = "fsi_ice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
